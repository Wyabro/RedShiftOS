<svg viewBox="0 0 1600 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <title id="title">RedShiftOS game development system</title>
  <desc id="description">An overview of the principles, lifecycle, working loop, foundation, and game startup path in RedShiftOS.</desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="26%" r="90%">
      <stop offset="0%" stop-color="#18213a"/>
      <stop offset="55%" stop-color="#0a0f20"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6252"/>
      <stop offset="100%" stop-color="#ffad42"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5285ff"/>
      <stop offset="18%" stop-color="#27c8e3"/>
      <stop offset="38%" stop-color="#40d995"/>
      <stop offset="55%" stop-color="#ffda56"/>
      <stop offset="72%" stop-color="#ff9d42"/>
      <stop offset="88%" stop-color="#ff5c50"/>
      <stop offset="100%" stop-color="#d73f68"/>
    </linearGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ff9a65"/>
      <stop offset="58%" stop-color="#e64e39"/>
      <stop offset="100%" stop-color="#791d28"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="940" fill="url(#background)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <g fill="#ffffff">
    <circle cx="92" cy="74" r="1.5" opacity="0.45"/><circle cx="238" cy="132" r="1" opacity="0.3"/>
    <circle cx="420" cy="56" r="1.3" opacity="0.4"/><circle cx="1116" cy="64" r="1" opacity="0.35"/>
    <circle cx="1302" cy="142" r="1.2" opacity="0.3"/><circle cx="1530" cy="236" r="1.5" opacity="0.42"/>
    <circle cx="44" cy="516" r="1.2" opacity="0.28"/><circle cx="1556" cy="704" r="1.2" opacity="0.32"/>
    <circle cx="206" cy="892" r="1" opacity="0.3"/><circle cx="1428" cy="874" r="1.4" opacity="0.34"/>
  </g>

  <g transform="translate(1480,92)" filter="url(#glow)">
    <ellipse rx="54" ry="16" fill="none" stroke="#ff8a62" stroke-opacity="0.48" stroke-width="3" transform="rotate(-20)"/>
    <circle r="27" fill="url(#planet)"/>
    <ellipse rx="54" ry="16" fill="none" stroke="#ff6252" stroke-opacity="0.92" stroke-width="3" transform="rotate(-20)" stroke-dasharray="82 220"/>
  </g>

  <g text-anchor="middle">
    <text x="800" y="84" font-size="70" font-weight="850" letter-spacing="1">
      <tspan fill="url(#brand)">REDSHIFT</tspan><tspan fill="#edf2fb">OS</tspan>
    </text>
    <text x="800" y="121" font-size="18" font-weight="650" letter-spacing="5" fill="#9ba7bc">HUMAN-DIRECTED · AI-ASSISTED GAME DEVELOPMENT</text>
    <text x="800" y="154" font-size="20" fill="#c6cfdd">One durable process from the first question to shipped proof.</text>
  </g>
  <rect x="596" y="174" width="408" height="5" rx="2.5" fill="url(#spectrum)"/>

  <g filter="url(#shadow)">
    <g>
      <rect x="56" y="210" width="472" height="132" rx="18" fill="#111a2d" stroke="#4e83ff" stroke-opacity="0.5"/>
      <rect x="56" y="210" width="472" height="5" rx="2.5" fill="#4e83ff"/>
      <circle cx="92" cy="252" r="15" fill="#4e83ff" fill-opacity="0.18" stroke="#6f9bff"/>
      <path d="M84 252 l6 6 11 -13" fill="none" stroke="#8db0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="258" font-size="21" font-weight="750" fill="#eef3fb">PROVE BEFORE PRODUCTION</text>
      <text x="82" y="294" font-size="18" fill="#aab5c8">Ask one question. Build the cheapest honest test.</text>
      <text x="82" y="320" font-size="18" fill="#aab5c8">Only human evidence earns KEEP.</text>
    </g>
    <g>
      <rect x="564" y="210" width="472" height="132" rx="18" fill="#111a2d" stroke="#35d494" stroke-opacity="0.5"/>
      <rect x="564" y="210" width="472" height="5" rx="2.5" fill="#35d494"/>
      <circle cx="600" cy="252" r="15" fill="#35d494" fill-opacity="0.18" stroke="#58e0aa"/>
      <path d="M592 248 h16 M592 254 h16 M592 260 h11" fill="none" stroke="#73e5b7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="628" y="258" font-size="21" font-weight="750" fill="#eef3fb">KEEP THE WORK COHERENT</text>
      <text x="590" y="294" font-size="18" fill="#aab5c8">One top task. Clear ownership. Targeted changes.</text>
      <text x="590" y="320" font-size="18" fill="#aab5c8">Important decisions survive the session.</text>
    </g>
    <g>
      <rect x="1072" y="210" width="472" height="132" rx="18" fill="#111a2d" stroke="#ff6753" stroke-opacity="0.5"/>
      <rect x="1072" y="210" width="472" height="5" rx="2.5" fill="#ff6753"/>
      <circle cx="1108" cy="252" r="15" fill="#ff6753" fill-opacity="0.18" stroke="#ff8877"/>
      <path d="M1099 252 l6 6 12 -13" fill="none" stroke="#ff9c8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1136" y="258" font-size="21" font-weight="750" fill="#eef3fb">VERIFY WHAT YOU SHIP</text>
      <text x="1098" y="294" font-size="18" fill="#aab5c8">Confidence is not proof. Local files are not proof.</text>
      <text x="1098" y="320" font-size="18" fill="#aab5c8">The real artifact is the source of truth.</text>
    </g>
  </g>

  <text x="56" y="395" font-size="19" font-weight="750" letter-spacing="2" fill="#eef3fb">THE DEVELOPMENT LIFECYCLE</text>
  <text x="1544" y="395" text-anchor="end" font-size="18" font-style="italic" fill="#8996ac">cool idea → warm evidence → shipped result</text>

  <g filter="url(#shadow)">
    <g><rect x="56" y="414" width="200" height="106" rx="14" fill="#111a2d" stroke="#5285ff" stroke-opacity="0.7"/><circle cx="86" cy="446" r="16" fill="#5285ff"/><text x="86" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#08101c">1</text><text x="78" y="486" font-size="18" font-weight="750" fill="#eef3fb">PROJECT</text><text x="78" y="510" font-size="18" fill="#9ba7bc">define the promise</text></g>
    <g><rect x="270" y="414" width="200" height="106" rx="14" fill="#111a2d" stroke="#27c8e3" stroke-opacity="0.7"/><circle cx="300" cy="446" r="16" fill="#27c8e3"/><text x="300" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#08101c">2</text><text x="292" y="486" font-size="18" font-weight="750" fill="#eef3fb">DESIGN</text><text x="292" y="510" font-size="18" fill="#9ba7bc">shape the experience</text></g>
    <g><rect x="484" y="414" width="200" height="106" rx="14" fill="#111a2d" stroke="#40d995" stroke-opacity="0.7"/><circle cx="514" cy="446" r="16" fill="#40d995"/><text x="514" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#08101c">3</text><text x="506" y="486" font-size="18" font-weight="750" fill="#eef3fb">ENGINEERING</text><text x="506" y="510" font-size="18" fill="#9ba7bc">set boundaries</text></g>
    <g><rect x="698" y="414" width="200" height="106" rx="14" fill="#111a2d" stroke="#ffda56" stroke-opacity="0.7"/><circle cx="728" cy="446" r="16" fill="#ffda56"/><text x="728" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#08101c">4</text><text x="720" y="486" font-size="18" font-weight="750" fill="#eef3fb">IMPLEMENT</text><text x="720" y="510" font-size="18" fill="#9ba7bc">build approved work</text></g>
    <g><rect x="912" y="414" width="200" height="106" rx="14" fill="#111a2d" stroke="#ff9d42" stroke-opacity="0.7"/><circle cx="942" cy="446" r="16" fill="#ff9d42"/><text x="942" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#08101c">5</text><text x="934" y="486" font-size="18" font-weight="750" fill="#eef3fb">PLAYTEST</text><text x="934" y="510" font-size="18" fill="#9ba7bc">players over opinion</text></g>
    <g><rect x="1126" y="414" width="200" height="106" rx="14" fill="#111a2d" stroke="#ff5c50" stroke-opacity="0.7"/><circle cx="1156" cy="446" r="16" fill="#ff5c50"/><text x="1156" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#08101c">6</text><text x="1148" y="486" font-size="18" font-weight="750" fill="#eef3fb">PRODUCTION</text><text x="1148" y="510" font-size="18" fill="#9ba7bc">ship and prove it</text></g>
    <g><rect x="1340" y="414" width="204" height="106" rx="14" fill="#111a2d" stroke="#d73f68" stroke-opacity="0.7"/><circle cx="1370" cy="446" r="16" fill="#d73f68"/><text x="1370" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#08101c">7</text><text x="1362" y="486" font-size="18" font-weight="750" fill="#eef3fb">POSTMORTEM</text><text x="1362" y="510" font-size="18" fill="#9ba7bc">keep the lesson</text></g>
  </g>

  <g fill="#aeb9ca" font-size="24" font-weight="700" text-anchor="middle">
    <text x="263" y="476">›</text><text x="477" y="476">›</text><text x="691" y="476">›</text>
    <text x="905" y="476">›</text><text x="1119" y="476">›</text><text x="1333" y="476">›</text>
  </g>

  <path d="M1442 536 v24 q0 14 -14 14 H38 q-14 0 -14 -14 V460 q0 -14 14 -14 h25" fill="none" stroke="#a78bfa" stroke-opacity="0.62" stroke-width="2.5" stroke-dasharray="7 8"/>
  <path d="M70 446 l-14 -7 v14 z" fill="#a78bfa"/>
  <rect x="490" y="557" width="620" height="34" rx="17" fill="#0b1120" stroke="#a78bfa" stroke-opacity="0.45"/>
  <text x="800" y="581" text-anchor="middle" font-size="18" font-weight="650" fill="#c9bcff">LEARN → FEED THE USEFUL PART BACK INTO THE SYSTEM</text>

  <g filter="url(#shadow)">
    <g>
      <rect x="56" y="626" width="472" height="206" rx="18" fill="#111a2d" stroke="#ff6d59" stroke-opacity="0.42"/>
      <text x="82" y="661" font-size="19" font-weight="750" letter-spacing="1.5" fill="#ff806d">FOUNDATION</text>
      <text x="82" y="689" font-size="18" fill="#9ba7bc">Manifesto always; reference law pulled by task.</text>
      <g font-size="18" fill="#e5ebf5">
        <circle cx="88" cy="726" r="4" fill="#ff6d59"/><text x="104" y="732">Manifesto + studio philosophy</text>
        <circle cx="88" cy="764" r="4" fill="#ff6d59"/><text x="104" y="770">Feature lifecycle + evidence states</text>
        <circle cx="88" cy="802" r="4" fill="#ff6d59"/><text x="104" y="808">Lessons, anti-patterns, and decisions</text>
      </g>
    </g>
    <g>
      <rect x="564" y="626" width="472" height="206" rx="18" fill="#111a2d" stroke="#35d4c3" stroke-opacity="0.42"/>
      <text x="590" y="661" font-size="19" font-weight="750" letter-spacing="1.5" fill="#55dfd2">THE WORKING LOOP</text>
      <text x="590" y="689" font-size="18" fill="#9ba7bc">AI builds inside visible human checkpoints.</text>
      <g font-size="18" fill="#e5ebf5">
        <text x="590" y="732">Explore → Plan → Approve → Implement</text>
        <text x="590" y="770">Diff-review → Commit → Validate → Handoff</text>
        <text x="590" y="808" fill="#8fded7">Human vision and taste stay in charge.</text>
      </g>
    </g>
    <g>
      <rect x="1072" y="626" width="472" height="206" rx="18" fill="#111a2d" stroke="#a78bfa" stroke-opacity="0.42"/>
      <text x="1098" y="661" font-size="19" font-weight="750" letter-spacing="1.5" fill="#b9a6ff">START A GAME</text>
      <text x="1098" y="689" font-size="18" fill="#9ba7bc">A small template connects the game to the OS.</text>
      <g font-size="18" fill="#e5ebf5">
        <circle cx="1108" cy="727" r="12" fill="#a78bfa"/><text x="1108" y="733" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0e1c">1</text><text x="1132" y="733">Pin RedShiftOS at ./RedShiftOS</text>
        <circle cx="1108" cy="765" r="12" fill="#a78bfa"/><text x="1108" y="771" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0e1c">2</text><text x="1132" y="771">Copy the game files + pointers</text>
        <circle cx="1108" cy="803" r="12" fill="#a78bfa"/><text x="1108" y="809" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0e1c">3</text><text x="1132" y="809">Define one promise and one top task</text>
      </g>
    </g>
  </g>

  <line x1="56" y1="872" x2="1544" y2="872" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="800" y="910" text-anchor="middle" font-size="23" font-weight="650" fill="#e3e9f3">The code changes from game to game. <tspan fill="#ff806d">The process stays coherent.</tspan></text>
</svg>
